stages:
  - build
  - package
  - release

image: ghcr.io/cirruslabs/flutter:stable

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  FLUTTER_VERSION: "3.44.6"
  ORG_GRADLE_PROJECT_lockMode: "STRICT"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
    - android/.gradle/
    - .fvm/

build_apk:
  stage: build

  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

  before_script:
    - dart pub global activate fvm
    - export PATH="$PATH:$HOME/.pub-cache/bin"

    - fvm install $FLUTTER_VERSION
    - fvm use $FLUTTER_VERSION --force

    - fvm flutter --version
    - fvm flutter config --no-analytics

    # Decode Android signing keystore
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks

    # Signing variables
    - export KEYSTORE_PATH="$CI_PROJECT_DIR/android/app/release.jks"
    - export KEYSTORE_PASSWORD="$KEYSTORE_STORE_PASSWORD"
    - export KEY_ALIAS="$KEYSTORE_KEY_ALIAS"
    - export KEY_PASSWORD="$KEYSTORE_KEY_PASSWORD"

  script:
    - VERSION=${CI_COMMIT_TAG#v}

    - fvm flutter pub get --enforce-lockfile

    # Phase 15 — require the security & unit test suite to pass BEFORE
    # building and signing any APK.
    - fvm flutter test

    # Verify Gradle Dependency Lockfile
    - |
      if [ ! -f android/app/gradle.lockfile ]; then
        echo "app/gradle.lockfile is missing."
        exit 1
      fi
      (cd android && ./gradlew --no-daemon :app:dependencies > /dev/null)

    # Build Universal APK
    - |
      fvm flutter build apk \
        --release \
        --obfuscate \
        --split-debug-info=build/debug-info \
        --build-name="$VERSION" \
        --build-number="$CI_PIPELINE_IID"

    # Build Split APKs
    - |
      fvm flutter build apk \
        --release \
        --split-per-abi \
        --obfuscate \
        --split-debug-info=build/debug-info \
        --build-name="$VERSION" \
        --build-number="$CI_PIPELINE_IID"

    # Organize Release Files
    - |
      mkdir -p release
      cp build/app/outputs/flutter-apk/app-release.apk release/CampusBite-universal.apk
      cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/CampusBite-arm64-v8a.apk
      cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/CampusBite-armeabi-v7a.apk
      cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/CampusBite-x86_64.apk

    # Generate SHA256 Checksums
    - |
      cd release
      sha256sum CampusBite-universal.apk > CampusBite-universal.apk.sha256
      sha256sum CampusBite-arm64-v8a.apk > CampusBite-arm64-v8a.apk.sha256
      sha256sum CampusBite-armeabi-v7a.apk > CampusBite-armeabi-v7a.apk.sha256
      sha256sum CampusBite-x86_64.apk > CampusBite-x86_64.apk.sha256
      cd ..

    # Generate release.json from template
    - |
      apt-get update && apt-get install -y gettext-base python3
      VERSION="$VERSION" REPOSITORY="$CI_PROJECT_PATH" TAG="$CI_COMMIT_TAG" \
        envsubst '${VERSION} ${REPOSITORY} ${TAG}' \
        < .github/release-template.json \
        > release/release.json
      python3 -m json.tool release/release.json > /dev/null

  after_script:
    - rm -f android/app/release.jks

  artifacts:
    name: "CampusBite-$CI_COMMIT_TAG"
    paths:
      - release/
      - build/debug-info/

package_apk:
  stage: package

  image: curlimages/curl:latest

  needs:
    - build_apk

  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

  script:
    - |
      for file in release/*; do
        filename=$(basename "$file")
        echo "Uploading $filename..."
        curl \
          --fail \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/campus-bite/${CI_COMMIT_TAG}/${filename}"
      done

create_release:
  stage: release

  image: registry.gitlab.com/gitlab-org/release-cli:latest

  needs:
    - package_apk

  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

  script:
    - echo "Creating GitLab Release..."

  release:
    tag_name: "$CI_COMMIT_TAG"

    name: "Campus Bite $CI_COMMIT_TAG"

    description: '.github/release-notes.md'

    assets:
      links:
        - name: "CampusBite Universal APK"
          url: "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/campus-bite/${CI_COMMIT_TAG}/CampusBite-universal.apk"
          link_type: package

        - name: "CampusBite ARM64-v8a APK"
          url: "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/campus-bite/${CI_COMMIT_TAG}/CampusBite-arm64-v8a.apk"
          link_type: package

        - name: "CampusBite ARMv7 APK"
          url: "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/campus-bite/${CI_COMMIT_TAG}/CampusBite-armeabi-v7a.apk"
          link_type: package

        - name: "CampusBite x86_64 APK"
          url: "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/campus-bite/${CI_COMMIT_TAG}/CampusBite-x86_64.apk"
          link_type: package

        - name: "release.json"
          url: "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/campus-bite/${CI_COMMIT_TAG}/release.json"
          link_type: package

