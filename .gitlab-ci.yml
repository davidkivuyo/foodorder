stages:
  - build
  - release

# Use a generic, always-published base image; we pin the exact Flutter
# version ourselves below via FVM, so we're not dependent on cirruslabs
# having built an image for this exact patch release.
image: ghcr.io/cirruslabs/flutter:stable

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  FLUTTER_VERSION: "3.44.6"   # matches your local dev machine exactly

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
    - android/.gradle/
    - .fvm/

build_apk:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    # Pin the exact Flutter/Dart SDK version regardless of what the base image ships
    - dart pub global activate fvm
    - export PATH="$PATH:$HOME/.pub-cache/bin"
    - fvm install $FLUTTER_VERSION
    - fvm use $FLUTTER_VERSION --force

    - fvm flutter --version
    - fvm flutter config --no-analytics

    # Decode keystore from a masked/protected CI/CD variable (never commit it)
    - echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks

    # Write key.properties dynamically instead of committing it
    - |
      cat <<EOF > android/key.properties
      storePassword=$KEYSTORE_STORE_PASSWORD
      keyPassword=$KEYSTORE_KEY_PASSWORD
      keyAlias=$KEYSTORE_KEY_ALIAS
      storeFile=$CI_PROJECT_DIR/android/app/release.jks
      EOF

  script:
    - VERSION=$(echo $CI_COMMIT_TAG | sed 's/^v//')

    - fvm flutter pub get --enforce-lockfile

    - >
      fvm flutter build apk --release
      --build-name=$VERSION --build-number=$CI_PIPELINE_IID
      --obfuscate --split-debug-info=build/debug-info
      --dart-define-from-file=config/prod.json

  after_script:
    - rm -f android/app/release.jks android/key.properties

  artifacts:
    name: "app-release-$CI_COMMIT_TAG"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/debug-info/
    expire_in: 30 days

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - job: build_apk
      artifacts: true
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG..."
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release build for tag $CI_COMMIT_TAG"
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: "Download Release APK"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/build/app/outputs/flutter-apk/app-release.apk"
