<div class="pb-safe h-8"></div>
<script>
        // Micro-interaction: Password visibility toggle
        const toggleBtn = document.querySelector('button span:contains("visibility")')?.parentElement;
        const passwordInput = document.querySelector('#password');
        
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleBtn.querySelector('span').textContent = isPassword ? 'visibility_off' : 'visibility';
            });
        }

        // Custom selector polyfill for the demo
        document.querySelectorAll('button').forEach(btn => {
            if(btn.innerHTML.includes('visibility')) {
                btn.addEventListener('click', (e) => {
                    const input = btn.previousElementSibling;
                    const icon = btn.querySelector('span');
                    if(input.type === 'password') {
                        input.type = 'text';
                        icon.innerText = 'visibility_off';
                    } else {
                        input.type = 'password';
                        icon.innerText = 'visibility';
                    }
                });
            }
        });
    </script>
