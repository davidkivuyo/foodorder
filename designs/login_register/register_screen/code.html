<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md">
<!-- Hero Background Animation / Graphic Area -->
<div class="relative w-full h-48 md:h-64 overflow-hidden bg-primary-container">
<!-- Abstract Decorative Graphics -->
<div class="absolute top-0 left-0 w-full h-full opacity-20 pointer-events-none">
<div class="absolute top-[-20%] left-[-10%] w-64 h-64 bg-secondary rounded-full blur-3xl"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-80 h-80 bg-primary-fixed-dim rounded-full blur-3xl"></div>
</div>
<div class="relative z-10 flex flex-col items-center justify-center h-full text-center px-gutter">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-primary-container tracking-tight">Campus Bite</h1>
<p class="font-title-md text-title-md text-primary-fixed mt-xs">Elevate Your Campus Dining</p>
</div>
</div>
<!-- Main Registration Canvas -->
<main class="flex-grow flex items-start justify-center px-gutter pb-xl mt-lg">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg p-lg border border-outline-variant">
<!-- Header -->
<div class="mb-lg">
<h2 class="font-headline-sm text-headline-sm text-primary">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Join the campus food community</p>
</div>
<!-- Form -->
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant px-xs" for="fullName">Full Name</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant px-md py-sm transition-all input-focus-ring">
<span class="material-symbols-outlined text-outline mr-sm">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body-md placeholder:text-outline-variant" id="fullName" placeholder="John Doe" type="text">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant px-xs" for="email">University Email</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant px-md py-sm transition-all input-focus-ring">
<span class="material-symbols-outlined text-outline mr-sm">alternate_email</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body-md placeholder:text-outline-variant" id="email" placeholder="student@university.edu" type="email">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant px-xs" for="password">Password</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant px-md py-sm transition-all input-focus-ring">
<span class="material-symbols-outlined text-outline mr-sm">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body-md placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password">
<button class="material-symbols-outlined text-outline-variant hover:text-outline transition-colors" type="button">visibility</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant px-xs" for="confirmPassword">Confirm Password</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant px-md py-sm transition-all input-focus-ring">
<span class="material-symbols-outlined text-outline mr-sm">lock_reset</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body-md placeholder:text-outline-variant" id="confirmPassword" placeholder="••••••••" type="password">
</div>
</div>
<!-- Terms & Conditions -->
<div class="flex items-center gap-sm py-xs">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20" id="terms" type="checkbox">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="terms">
                        I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms &amp; Conditions</a>
</label>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-md rounded-full font-title-md text-title-md shadow-sm transition-all bouncy-btn mt-base flex items-center justify-center gap-sm" type="submit">
                    Register
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<!-- Bottom Navigation Link -->
<div class="mt-lg pt-lg border-t border-surface-container-highest text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-secondary font-semibold hover:underline decoration-2 underline-offset-4 ml-xs" href="#">Login</a>
</p>

</div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Join thousands of students saving time on every meal.</p>
</div>

<!-- Micro-interaction Script -->
<script>
        // Toggle Password Visibility
        const passToggle = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('#password');
        
        if (passToggle && passInput) {
            passToggle.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                passToggle.textContent = isPass ? 'visibility_off' : 'visibility';
            });
        }

        // Simple Form Focus Styles (Enhanced via JS if needed, but handled by Tailwind for now)
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-md');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-md');
            });
        });
    </script>


</body></html>
