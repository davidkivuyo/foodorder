<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Campus Bite - Welcome</title>
<!-- Plus Jakarta Sans Font -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#2e7d32',
              orange: '#f59e0b',
              surface: '#f8f9fa',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          borderRadius: {
            'eight': '8px',
          }
        }
      }
    }
  </script>
<style data-purpose="layout-optimizations">
    /* Ensure the background image covers the full viewport height on mobile */
    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .hero-bg {
      background-image: url('https://lh3.googleusercontent.com/aida/AP1WRLvk8lB3r3giR2bP754KHe1arrz_ut6qLklpyBOsExfTnnHwqkRjpFgxl3H_eg0Yf2Yp0ZhnNAMSimhMIH-Ohbj9i5bqd6PEOxU4G0DlhrVvwFxKoP2fc88QNIr3D6jxBMRfPAHWAThmfPBv6uO3xtAmnC8V_HxFYUfNZEM5eJr8M17V_cmvQJClOKkWE6_NUpTK64DfQT18MyOQV5mdHZdy72MipAcXIbvxp-vzKTWO1RythPvW4jn00eM');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    /* Gradient overlay to ensure text readability at the top and bottom */
    .overlay-gradient {
      background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.7) 100%);
    }
  </style>
</head>
<body class="bg-brand-surface antialiased">
<!-- BEGIN: HeroBackgroundContainer -->
<main class="relative h-screen w-full hero-bg" data-purpose="onboarding-container">
<!-- Gradient for text contrast -->
<div class="absolute inset-0 overlay-gradient"></div>
<!-- BEGIN: HeaderSection -->
<header class="relative z-10 pt-12 px-6 text-center" data-purpose="app-branding">
<div class="inline-flex items-center gap-2">
<!-- Minimalist Fork/Knife Icon Placeholder representing the logo -->
<div class="bg-brand-green p-2 rounded-eight shadow-lg">
<svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h1 class="text-2xl font-extrabold text-white tracking-tight drop-shadow-md">Campus Bite</h1>
</div>
</header>
<!-- END: HeaderSection -->
<!-- Note: The "Order Ready!" card is part of the provided IMAGE_7 and is visually centered in the composition -->
<!-- BEGIN: BottomActionSection -->
<section class="absolute bottom-0 left-0 right-0 p-8 pb-12 z-10 flex flex-col items-center px-6" data-purpose="onboarding-actions">
<!-- Typography Content -->
<div class="text-center mb-8">
<h2 class="text-3xl font-bold text-white mb-2 drop-shadow-sm">
          Ready for your next bite?
        </h2>
<p class="text-white/90 text-base font-medium max-w-[280px] mx-auto">
          Order from your favorite campus spots and skip the cafeteria queues forever.
        </p>
</div>
<!-- Action Button -->
<button class="w-full max-w-sm py-4 bg-brand-green hover:bg-green-800 active:scale-[0.98] transition-all text-white font-bold text-lg rounded-eight shadow-xl flex items-center justify-center gap-2" data-purpose="primary-cta" id="btn-start-ordering">
<span class="">Start Ordering</span>
<svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" fill-rule="evenodd"></path>
</svg>
</button>
<!-- Secondary Link -->
<button class="mt-6 text-white/80 font-semibold text-sm underline underline-offset-4 decoration-white/40" data-purpose="secondary-link">
        Already have an account? Sign In
      </button>
</section>
<!-- END: BottomActionSection -->
</main>
<!-- END: HeroBackgroundContainer -->
<script data-purpose="interaction-logic">
    // Simple click handler for the primary button
    document.getElementById('btn-start-ordering').addEventListener('click', function() {
      console.log('Navigating to menu selection...');
      // Navigation logic would go here
    });
  </script>


</body></html>
