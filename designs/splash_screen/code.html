<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .loading-bar-fill {
            animation: progress 2.5s ease-in-out infinite;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;

<!-- Interactive Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Log to confirm load
            console.log("Campus Bite Splash Initialized");
            
            // Subtle parallax effect on mouse move for desktop
            if (window.innerWidth > 768) {
                document.addEventListener('mousemove', (e) => {
                    const x = (window.innerWidth / 2 - e.pageX) / 50;
                    const y = (window.innerHeight / 2 - e.pageY) / 50;
                    const logo = document.querySelector('.animate-fade-in-up');
                    if(logo) {
                        logo.style.transform = `translate(${x}px, ${y}px)`;
                    }
                });
            }

            // Simulate transition after 3 seconds
            setTimeout(() => {
                const main = document.querySelector('main');
                if(main) {
                    main.style.transition = 'opacity 0.5s ease-out';
                    main.style.opacity = '0';
                    setTimeout(() => {
                        console.log("Transitioning to Main App...");
                        // In a real app, window.location.href would change here
                    }, 500);
                }
            }, 3000);
        });
    </script>
