name: campusbite
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  google_fonts: ^8.1.0
  dash_no_internet_screen: ^1.0.0
  connectivity_plus: ^7.2.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
