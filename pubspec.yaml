name: campusbite
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.9
  dash_no_internet_screen: ^1.0.0
  cached_network_image: ^3.4.1
  flex_color_scheme: ^8.4.0
  url_launcher: ^6.3.2
  firebase_core: 4.11.0
  firebase_auth: 6.5.4
  cloud_firestore: 6.6.0
  shared_preferences: ^2.3.2
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - designs/
    - designs/assets/
