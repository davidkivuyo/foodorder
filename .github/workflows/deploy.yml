name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - main  # Trigger build on pushes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v4

      # Step 2: Set up Java (required by Flutter)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Flutter (Pinned to v2.23.0 action SHA + SDK 3.44.2)
      - uses: subosito/flutter-action@1a44944d180802c6d71b3e8006e8979c6bb44e05
        with:
          channel: 'stable'
          cache: true

      # Step 4: Build Flutter Web
      - name: Build Web
        run: |
          flutter pub get
          flutter build web --release --base-href "/"

      # Step 5: Deploy build/web folder to Cloudflare Pages (Pinned to wrangler-action@v3/v4 baseline)
      - name: Lets Deploy
        uses: cloudflare/wrangler-action@1029e900a30b42c4b8b693998b584d4fa1561701
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name="foodorder"
