name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - buildweb  # Trigger build on pushes to the buildweb branch

jobs:
  deploy:
    # Deploy only after the no-show emulator integration suite has passed.
    # Without this dependency GitHub Actions would run the jobs in parallel
    # and could ship to Cloudflare Pages before (or despite) a failing suite.
    needs: no-show-integration
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v4

      # Step 2: Set up Java (required by Flutter)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Flutter (Pinned to a fully verified 40-character release SHA)
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Run the security & unit test suite before building.
      # auth_hardening_test.dart contains guardrail tests (Cloud Functions,
      # App Check, Firestore rules, update security, secret scanning); a
      # regression must fail the deploy, not ship to Cloudflare Pages.
      # firestore.rules is tracked, so the rules guardrails run here as well.
      - name: Run Security & Unit Tests
        run: |
          flutter pub get --enforce-lockfile
          flutter test

      # Step 5: Build Flutter Web
      - name: Build Web
        # Phase 15: App Check — inject the reCAPTCHA v3 site key for web
        # attestation. The web RELEASE build fails closed when the key is
        # empty (lib/main.dart refuses to start), so this step must fail
        # before building when the secret is missing — otherwise a broken
        # app with no web attestation would be deployed.
        env:
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "$RECAPTCHA_SITE_KEY" ]; then
            echo "::error::RECAPTCHA_SITE_KEY is required for App Check on web release builds. Set it in GitHub repository secrets before deploying."
            exit 1
          fi
          flutter pub get --enforce-lockfile
          flutter build web --release --base-href "/" \
            --dart-define=RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY"

      # Step 6: Deploy build/web folder to Cloudflare Pages (Pinned to a fully verified 40-character release SHA)
      - name: Lets Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name="foodorder"

  # Order-lifecycle integration suites: run the REAL Firestore emulator with
  # the REAL firestore.rules and the REAL order Cloud Functions (executable
  # coverage for the static guardrails in no_show_foundation_test.dart and
  # order_cancellation_foundation_test.dart). The Firestore emulator
  # requires Java 21+.
  no-show-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Run no-show emulator integration suite
        run: npm run test:no-show:integration
        working-directory: functions

      - name: Run order-cancellation emulator integration suite
        run: npm run test:cancellation:integration
        working-directory: functions
