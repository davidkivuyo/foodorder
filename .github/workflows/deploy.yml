name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main  # Or your release branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v4

      # Step 2: Set up Java
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Build Flutter Web
      - name: Build Web
        run: |
          flutter pub get
          flutter build web --release --base-href "/"

      # Step 5: Deploy build/web folder to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FOODORDER_8FFCF }}"
          projectId: "foodorder-8ffcf"
          channelId: live
