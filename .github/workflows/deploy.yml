name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - buildweb  # Trigger build on pushes to the buildweb branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v4

      # Step 2: Set up Java (required by Flutter)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Flutter (Pinned to a fully verified 40-character release SHA)
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Build Flutter Web
      - name: Build Web
        run: |
          flutter pub get
          flutter build web --release --base-href "/"

      # Step 5: Deploy build/web folder to Cloudflare Pages (Pinned to a fully verified 40-character release SHA)
      - name: Lets Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name="foodorder"
