name: Build & Publish Release APKs

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle wrapper and dependencies

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # Caches Flutter engine artifacts

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Security & Unit Tests
        run: flutter test

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Extract Version
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          IS_TAG="false"
          VERSION="0.0.0-dev"
          IS_PRERELEASE="false"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Validate the ENTIRE tag name as a semantic version tag
            # (vMAJOR.MINOR.PATCH with optional -prerelease/+build). Partial
            # tags (v1.2), multi-segment tags (v1.2.3.4), non-numeric segments
            # and shell-special characters all fail the anchored regex and
            # abort the job instead of building with a mangled version.
            if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              IS_TAG="true"
              VERSION="${REF#v}"
              if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
                IS_PRERELEASE="true"
              fi
            else
              echo "ERROR: tag '$REF' is not a valid semantic version tag (expected vMAJOR.MINOR.PATCH[-prerelease])." >&2
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IS_TAG=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build Universal APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Build Split APKs
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Organize Release Files
        run: |
          mkdir -p release

          cp build/app/outputs/flutter-apk/app-release.apk \
            release/CampusBite-universal.apk

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            release/CampusBite-arm64-v8a.apk

          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            release/CampusBite-armeabi-v7a.apk

          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            release/CampusBite-x86_64.apk

      - name: Generate SHA256 Checksums
        run: |
          cd release

          sha256sum CampusBite-universal.apk > CampusBite-universal.apk.sha256
          sha256sum CampusBite-arm64-v8a.apk > CampusBite-arm64-v8a.apk.sha256
          sha256sum CampusBite-armeabi-v7a.apk > CampusBite-armeabi-v7a.apk.sha256
          sha256sum CampusBite-x86_64.apk > CampusBite-x86_64.apk.sha256

      - name: Generate release.json from template
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          command -v envsubst >/dev/null || sudo apt-get update && sudo apt-get install -y gettext-base
          envsubst '${VERSION} ${REPOSITORY} ${TAG}' \
            < .github/release-template.json \
            > release/release.json

          python3 -m json.tool release/release.json > /dev/null

      - name: Validate release.json URLs
        run: |
          python3 - <<'EOF'
          import json
          import re
          import sys
          from urllib.parse import urlparse

          ALLOWED_HOST = "dl.larason.space"

          with open("release/release.json") as f:
              data = json.load(f)

          GITHUB_DOWNLOAD = re.compile(
              r"^https://github\.com/[^/]+/[^/]+/releases/download/[^/]+/"
          )

          def check_url(url, path):
              if not re.match(r"^https?://", url, re.I):
                  return
              if GITHUB_DOWNLOAD.match(url):
                  return
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != ALLOWED_HOST:
                  netloc = parsed.hostname or ""
                  if parsed.port:
                      netloc += f":{parsed.port}"
                  redacted = f"{parsed.scheme}://{netloc}{parsed.path}"
                  print(
                      f"ERROR: disallowed URL at {path}: {redacted}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          def walk(obj, path):
              if isinstance(obj, str):
                  check_url(obj, path)
              elif isinstance(obj, list):
                  for i, item in enumerate(obj):
                      walk(item, f"{path}[{i}]")
              elif isinstance(obj, dict):
                  for key, value in obj.items():
                      walk(value, f"{path}.{key}")

          walk(data, "$")
          print("release.json URL check passed")
          EOF

      - name: Verify Release Files
        run: |
          ls -lh release

      - name: Publish GitHub Release
        # Publish only when the validated tag parsed as a release version;
        # workflow_dispatch builds (VERSION fallback) never publish.
        if: steps.version.outputs.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # Prerelease tags (e.g. v1.2.3-beta.1) publish as prereleases.
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
          body_path: .github/release-notes.md
          files: |
            release/CampusBite-universal.apk
            release/CampusBite-arm64-v8a.apk
            release/CampusBite-armeabi-v7a.apk
            release/CampusBite-x86_64.apk
            release/CampusBite-universal.apk.sha256
            release/CampusBite-arm64-v8a.apk.sha256
            release/CampusBite-armeabi-v7a.apk.sha256
            release/CampusBite-x86_64.apk.sha256
            release/release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy

      - name: Cleanup
        if: always()
        run: |
          rm -f android/app/release.jks
