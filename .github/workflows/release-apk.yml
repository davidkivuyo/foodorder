name: Build & Publish Release APKs

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # CI enforces STRICT dependency locking: the committed app/gradle.lockfile
      # (generated by an all-ABI build) is fully verified and enforced for the
      # fat + --split-per-abi release builds below. Gradle picks this up as the
      # `lockMode` project property; local dev defaults to LENIENT with a
      # separate gradle.dev.lockfile (see android/build.gradle.kts).
      ORG_GRADLE_PROJECT_lockMode: STRICT

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        # Verifies the checksum of every gradle-wrapper.jar in the repo so a
        # tampered wrapper is rejected before it can execute arbitrary code.
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle wrapper and dependencies

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true # Caches Flutter engine artifacts

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Security & Unit Tests
        run: flutter test

      - name: Verify Gradle Dependency Lockfile
        # The Android build runs with STRICT dependency locking in CI
        # (ORG_GRADLE_PROJECT_lockMode=STRICT above): the committed
        # app/gradle.lockfile is fully enforced, so an out-of-date or incomplete
        # lock state fails this check. Fail fast here: abort when the lockfile
        # is missing instead of failing later during the APK build with an
        # opaque resolution error. (Local single-ABI dev builds keep LENIENT
        # mode with a separate gradle.dev.lockfile — see android/build.gradle.kts.)
        run: |
          if [ ! -f app/gradle.lockfile ]; then
            echo "::error::app/gradle.lockfile is missing. Commit it (regenerate with ./gradlew :app:dependencies --write-locks)."
            exit 1
          fi
          ./gradlew --no-daemon :app:dependencies > /dev/null
        working-directory: android

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Extract Version
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          IS_TAG="false"
          VERSION="0.0.0-dev"
          IS_PRERELEASE="false"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Validate the ENTIRE tag name as a semantic version tag
            # (vMAJOR.MINOR.PATCH with optional -prerelease/+build). Partial
            # tags (v1.2), multi-segment tags (v1.2.3.4), non-numeric segments
            # and shell-special characters all fail the anchored regex and
            # abort the job instead of building with a mangled version.
            # Complete SemVer: numeric core and numeric prerelease
            # identifiers must not have leading zeros, and prerelease/build
            # components must not be empty (e.g. v01.2.3, v1.2.3-01 and
            # v1.2.3-alpha..1 are rejected).
            if [[ "$REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$ ]]; then
              IS_TAG="true"
              VERSION="${REF#v}"
              if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
                IS_PRERELEASE="true"
              fi
            else
              echo "ERROR: tag '$REF' is not a valid semantic version tag (expected vMAJOR.MINOR.PATCH[-prerelease])." >&2
              exit 1
            fi
          fi
          if [[ "$IS_TAG" == "true" ]]; then
            # Release-ordering gate: the candidate tag must be semver-greater
            # than every previously published version tag (excluding itself,
            # so workflow re-runs of the same tag pass). This prevents the
            # ordering trap — e.g. shipping v1.0.0 after v1.8.0-dev strands
            # existing installs because 1.0.0 < 1.8.0-dev in semver and the
            # in-app updater never offers the "newer" build.
            python3 - "${REF#v}" <<'PYEOF' || { echo "ERROR: release-ordering gate failed for tag '$REF'." >&2; exit 1; }
          import re
          import subprocess
          import sys

          candidate = sys.argv[1]
          SEMVER = re.compile(
              r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-((?:0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?"
              r"(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          )


          def parse(tag):
              m = SEMVER.fullmatch(tag)
              if not m:
                  return None
              core = tuple(int(m.group(i)) for i in (1, 2, 3))
              return core, m.group(4)


          def pre_identifiers(pre):
              if not pre:
                  return []
              return [(0, int(p)) if p.isdigit() else (1, p) for p in pre.split(".")]


          def compare(a, b):
              # a, b = (core, prerelease-or-None); >0 when a > b per semver.
              if a[0] != b[0]:
                  return -1 if a[0] < b[0] else 1
              apre, bpre = a[1], b[1]
              if apre is None and bpre is None:
                  return 0
              if apre is None:
                  return 1  # a release sorts above a prerelease of the same core
              if bpre is None:
                  return -1
              ai, bi = pre_identifiers(apre), pre_identifiers(bpre)
              for x, y in zip(ai, bi):
                  if x != y:
                      return -1 if x < y else 1
              return len(ai) - len(bi)


          def existing_tags():
              try:
                  out = subprocess.run(
                      ["git", "ls-remote", "--tags", "origin", "refs/tags/v*"],
                      capture_output=True, text=True, check=True, timeout=30,
                  ).stdout
                  tags = []
                  for line in out.splitlines():
                      ref = line.split("\t")[-1] if "\t" in line else ""
                      if ref.endswith("^{}"):
                          continue  # peeled entry of an annotated tag
                      name = ref.rsplit("/", 1)[-1]
                      if name:
                          tags.append(name)
                  if tags:
                      return tags
              except Exception:
                  pass
              # Fallback: local tags (full clone).
              return subprocess.run(
                  ["git", "tag", "--list", "v*"],
                  capture_output=True, text=True, check=True,
              ).stdout.split()


          cand = parse("v" + candidate)
          if cand is None:
              # Defensive: an invalid candidate must never pass the ordering
              # gate even if the Extract Version bash regex diverged.
              print("ERROR: candidate v%s is not valid SemVer" % candidate,
                    file=sys.stderr)
              sys.exit(1)

          bad = []
          for tag in existing_tags():
              if tag == "v" + candidate:
                  continue  # the candidate itself (workflow re-runs)
              other = parse(tag)
              if other is None:
                  continue  # non-semver tags are not release candidates
              if compare(cand, other) <= 0:
                  bad.append(tag)

          if bad:
              print(
                  "ERROR: tag v%s is not semver-greater than previously published "
                  "tag(s): %s" % (candidate, ", ".join(sorted(bad))),
                  file=sys.stderr,
              )
              sys.exit(1)
          print("release-ordering gate passed for v%s" % candidate)
          PYEOF
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IS_TAG=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Validate SemVer Cases
        # Pins the strict SemVer grammar shared by the Extract Version regex
        # and the release-ordering gate: numeric core/prerelease identifiers
        # must not have leading zeros and prerelease/build components must not
        # be empty. A regression in either validator fails CI here.
        run: |
          python3 - <<'PYEOF'
          import re
          SEMVER = re.compile(
              r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
              r"(?:-((?:0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?"
              r"(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          )
          INVALID = [
              "v01.2.3",        # leading zero in core major
              "v1.2.3-01",      # leading zero in numeric prerelease identifier
              "v1.2.3-alpha..1",  # empty prerelease component
              "v1.2.03", "v1.2.3-1.02", "v1.2.3-", "v1.2.3-alpha.",
              "v1.2.3+", "v1.2.3+build..1",
          ]
          VALID = [
              "v0.0.0", "v1.2.3", "v10.20.30",
              "v1.2.3-alpha.1", "v1.2.3-0.3.7", "v1.2.3-x.7.z.92",
              "v1.2.3-rc.1+build.5", "v1.2.3+build.5",
          ]
          for tag in INVALID:
              assert SEMVER.fullmatch(tag) is None, f"python validator accepted {tag}"
          for tag in VALID:
              assert SEMVER.fullmatch(tag) is not None, f"python validator rejected {tag}"
          print("python SemVer cases passed")
          PYEOF
          BASH_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          for tag in v01.2.3 v1.2.3-01 v1.2.3-alpha..1 v1.2.03 v1.2.3-1.02 v1.2.3- v1.2.3-alpha. v1.2.3+ v1.2.3+build..1; do
            if [[ "$tag" =~ $BASH_RE ]]; then
              echo "ERROR: bash validator accepted invalid '$tag'" >&2
              exit 1
            fi
          done
          for tag in v0.0.0 v1.2.3 v10.20.30 v1.2.3-alpha.1 v1.2.3-0.3.7 v1.2.3-x.7.z.92 v1.2.3-rc.1+build.5 v1.2.3+build.5; do
            if [[ ! "$tag" =~ $BASH_RE ]]; then
              echo "ERROR: bash validator rejected valid '$tag'" >&2
              exit 1
            fi
          done
          echo "bash SemVer cases passed"

      - name: Build Universal APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Build Split APKs
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Organize Release Files
        run: |
          mkdir -p release

          cp build/app/outputs/flutter-apk/app-release.apk \
            release/CampusBite-universal.apk

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            release/CampusBite-arm64-v8a.apk

          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            release/CampusBite-armeabi-v7a.apk

          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            release/CampusBite-x86_64.apk

      - name: Generate SHA256 Checksums
        run: |
          cd release

          sha256sum CampusBite-universal.apk > CampusBite-universal.apk.sha256
          sha256sum CampusBite-arm64-v8a.apk > CampusBite-arm64-v8a.apk.sha256
          sha256sum CampusBite-armeabi-v7a.apk > CampusBite-armeabi-v7a.apk.sha256
          sha256sum CampusBite-x86_64.apk > CampusBite-x86_64.apk.sha256

      - name: Generate release.json from template
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          command -v envsubst >/dev/null || sudo apt-get update && sudo apt-get install -y gettext-base
          envsubst '${VERSION} ${REPOSITORY} ${TAG}' \
            < .github/release-template.json \
            > release/release.json

          python3 -m json.tool release/release.json > /dev/null

      - name: Validate release.json URLs
        run: |
          python3 - <<'EOF'
          import json
          import re
          import sys
          from urllib.parse import urlparse

          ALLOWED_HOST = "dl.larason.space"

          with open("release/release.json") as f:
              data = json.load(f)

          GITHUB_DOWNLOAD = re.compile(
              r"^https://github\.com/[^/]+/[^/]+/releases/download/[^/]+/"
          )

          def check_url(url, path):
              if not re.match(r"^https?://", url, re.I):
                  return
              if GITHUB_DOWNLOAD.match(url):
                  return
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != ALLOWED_HOST:
                  netloc = parsed.hostname or ""
                  if parsed.port:
                      netloc += f":{parsed.port}"
                  redacted = f"{parsed.scheme}://{netloc}{parsed.path}"
                  print(
                      f"ERROR: disallowed URL at {path}: {redacted}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          def walk(obj, path):
              if isinstance(obj, str):
                  check_url(obj, path)
              elif isinstance(obj, list):
                  for i, item in enumerate(obj):
                      walk(item, f"{path}[{i}]")
              elif isinstance(obj, dict):
                  for key, value in obj.items():
                      walk(value, f"{path}.{key}")

          walk(data, "$")
          print("release.json URL check passed")
          EOF

      - name: Verify Release Files
        run: |
          ls -lh release

      - name: Publish GitHub Release
        # Publish only when the validated tag parsed as a release version;
        # workflow_dispatch builds (VERSION fallback) never publish.
        if: steps.version.outputs.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # Prerelease tags (e.g. v1.2.3-beta.1) publish as prereleases.
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
          body_path: .github/release-notes.md
          files: |
            release/CampusBite-universal.apk
            release/CampusBite-arm64-v8a.apk
            release/CampusBite-armeabi-v7a.apk
            release/CampusBite-x86_64.apk
            release/CampusBite-universal.apk.sha256
            release/CampusBite-arm64-v8a.apk.sha256
            release/CampusBite-armeabi-v7a.apk.sha256
            release/CampusBite-x86_64.apk.sha256
            release/release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy

      - name: Cleanup
        if: always()
        run: |
          rm -f android/app/release.jks
